# Servicios de desarrollo local.
# Producción corre en VPS/contenedor: ver sección 2 de docs/ARQUITECTURA.md.
services:
  postgres:
    image: postgres:18-alpine
    container_name: route_generator_pg
    restart: unless-stopped
    environment:
      POSTGRES_DB: route_generator
      POSTGRES_USER: route_generator
      POSTGRES_PASSWORD: route_generator
    ports:
      # 5433 en el host: el 5432 lo ocupa el PostgreSQL nativo de la máquina.
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U route_generator -d route_generator"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
